name: rigel
description: A CHIP-8 interpreter made with flutter
version: 1.0.0
repository: https://github.com/TheYautja/Rigel

flutter:
  assets:
    - roms/games/

environment:
  sdk: ^3.11.0

# Add regular dependencies here.
dependencies:
  flame: ^1.36.0
  path: ^1.9.0
  sensors_plus: 7.0.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/tripleT.png"
  min_sdk_android: 21
  

